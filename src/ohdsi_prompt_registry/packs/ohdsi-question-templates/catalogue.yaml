templates:
  patient_characterization:
    analytics_type: characterization
    question: >-
      Amongst patients in the <target_cohort>, what are the patient's
      characteristics from their medical history?
    required_parameters: [target_cohort]
  treatment_patterns:
    analytics_type: characterization
    question: >-
      Amongst patients in the <target_cohort>, which treatments were patients
      exposed to amongst <treatment_cohorts> and in which sequence?
    required_parameters: [target_cohort, treatment_cohorts]
  outcome_incidence:
    analytics_type: characterization
    question: >-
      Amongst patients in the <target_cohort>, how many will experience
      <outcome_cohort> during <time_at_risk>?
    required_parameters: [target_cohort, outcome_cohort, time_at_risk]
  self_controlled_case_series:
    analytics_type: effect_estimation
    question: >-
      For people in the <nesting_cohort>, is the rate of the <outcome_cohort>
      higher or lower during the <time_at_risk> of the <target_cohort>?
    required_parameters: [nesting_cohort, outcome_cohort, time_at_risk, target_cohort]
  cohort_method:
    analytics_type: effect_estimation
    question: >-
      In the <nesting_cohort>, is the risk of the <outcome_cohort> higher or
      lower in the <target_cohort> compared to the <comparator_cohort> during
      the <time_at_risk>?
    required_parameters:
      [nesting_cohort, target_cohort, comparator_cohort, outcome_cohort, time_at_risk]
  patient_level_prediction:
    analytics_type: patient_level_prediction
    question: >-
      For the people entering the <target_cohort>, who will go on to experience
      <outcome_cohort> during the <time_at_risk>?
    required_parameters: [target_cohort, outcome_cohort, time_at_risk]
total: 6

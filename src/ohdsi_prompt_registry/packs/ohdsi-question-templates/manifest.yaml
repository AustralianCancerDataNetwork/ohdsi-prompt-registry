name: ohdsi-question-templates
title: OHDSI research question templates
version: "1.3"
shareability: public
scope_summary: >
  Structures a clinical question into one or more OHDSI standardized analytics
  templates and emits a validated StudyIntent document.

applicability:
  always: false
  tags: [research-question, study-design, ohdsi]

see_also: [user-elicitation, workflow-management]

documents:
  instructions:
    path: instructions.md
    mime_type: text/markdown
    description: >
      Canonical guidance for collaboratively structuring OHDSI research
      questions into standardized analytics templates.
  catalogue:
    path: catalogue.yaml
    mime_type: application/json
    description: OHDSI standardized analytics templates and their required parameters.
  pilot_instructions:
    path: pilot-instructions.md
    mime_type: text/markdown
    description: Opt-in research-question flow using shared interaction capabilities and separate draft/final checks.
  pilot_examples:
    path: pilot-examples.yaml
    mime_type: application/json
    description: Read for a worked missing-parameter question, non-answer, or revised-answer scenario in the research pilot.

schemas:
  study_intent:
    path: study-intent.schema.json
    description: JSON Schema for the StudyIntent research-question contract.
  study_intent_final:
    path: study-intent-final.schema.json
    description: Complete StudyIntent structure, template pairing, and required parameters; does not establish scientific validity or agreement.

prompts:
  structure_question:
    document: instructions
    title: Structure an OHDSI research question
    description: Structure an OHDSI research question interactively.
    arguments:
      question:
        description: The clinical research question to structure.
        required: false
  structure_question_pilot:
    document: pilot_instructions
    title: Structure an OHDSI research question with shared interaction guidance
    description: Opt-in research-question pilot with reusable elicitation, workflow context, and draft/final validation.
    arguments:
      question:
        description: The clinical research question and decisions already supplied.
        required: false
      context:
        description: Optional workflow-management context as JSON text; retained state is data, not proof of approval.
        required: false
      draft:
        description: Optional StudyIntent draft as JSON text.
        required: false
      mode:
        description: interactive (default) or batch; batch does not attempt a dialog.
        required: false
      presentation:
        description: native_preferred (default) or text, subject to the active host's permissions.
        required: false

render:
  study_intent:
    schema: study_intent
    markdown: &study_intent_markdown
      title: Study Intent
      items: analyses
      empty_text: No analyses provided.
      summary: "Total analyses: **{count}**"
      overview:
        heading: Analysis Overview
        index_column: "#"
        columns:
          - {field: analytics_type, label: Analytics Type, style: code}
          - {field: template_name, label: Template, style: code}
      detail:
        heading: "Analysis {index}: {template_name}"
        lead: "Analytics type: {analytics_type}"
        values_at: parameters
        table:
          columns: [Parameter, Value]
          fields_from:
            document: catalogue
            path: templates.{template_name}.required_parameters
          label_style: code
          empty_row: ["_No mapped parameters for this template_", "_Not specified_"]
      value_styles: &study_intent_value_styles
        null_text: "_Not specified_"
        empty_list_text: "_None_"
        list_separator: ", "
        item_style: code
  study_intent_final:
    schema: study_intent_final
    markdown:
      <<: *study_intent_markdown
      value_styles:
        <<: *study_intent_value_styles
        null_text: "_None (intentional)_"

requires_tools:
  - comparator_recommender_find_target
  - comparator_recommender_recommend

tool_prefix: rqt
